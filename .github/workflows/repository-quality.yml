name: Repository Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          files = sorted(
              path for path in Path(".").rglob("*.json")
              if ".git" not in path.parts
          )

          errors = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8-sig") as file:
                      json.load(file)
                  print(f"VALID: {path}")
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\nInvalid JSON files:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print(f"\nValidated {len(files)} JSON file(s).")
          PY

      - name: Reject sensitive file types
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t risky_files < <(
            find . -type f \
              \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) \
              -not -path './.git/*'
          )

          if ((${#risky_files[@]})); then
            printf 'Potentially sensitive files detected:\n'
            printf '%s\n' "${risky_files[@]}"
            exit 1
          fi

          echo "No prohibited sensitive file types detected."


